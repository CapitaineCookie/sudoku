<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#111827" id="themeColor">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sudoku">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=36">
  <title>Sudoku</title>
  <script>if (localStorage.getItem('theme') !== 'light') document.documentElement.classList.add('dark');</script>
</head>
<body>
  <div class="app">

    <header class="header">
      <button class="header-btn icon-btn" id="newGameBtn" aria-label="New Game">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </button>
      <h1 class="title">Sudoku</h1>
      <div class="header-right">
        <button class="header-btn icon-btn" id="gearBtn" aria-label="Settings">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

    </header>

    <div class="main">
    <div class="stats-bar">
      <div class="current-diff" id="currentDiff">Easy</div>
      <div class="timer" id="timer">0:00</div>
      <div class="mistakes" id="mistakes">Mistakes: 0/3</div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="undoBtn">
        <span class="ctrl-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg></span>
        <span class="ctrl-label">Undo</span>
      </button>
      <button class="ctrl-btn" id="eraseBtn">
        <span class="ctrl-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 21H8a2 2 0 0 1-1.42-.587l-3.994-3.999a2 2 0 0 1 0-2.828l10-10a2 2 0 0 1 2.829 0l5.999 6a2 2 0 0 1 0 2.828L12.834 21"/><path d="m5.082 11.09 8.828 8.828"/></svg></span>
        <span class="ctrl-label">Erase</span>
      </button>
      <button class="ctrl-btn" id="notesBtn">
        <span class="ctrl-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 21h8"/><path d="m15 5 4 4"/><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg></span>
        <span class="ctrl-label">Notes</span>
      </button>
      <button class="ctrl-btn" id="hintBtn">
        <span class="ctrl-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg></span>
        <span class="ctrl-label">Hint</span>
      </button>
    </div>

    <div class="numpad" id="numpad">
      <button class="num-btn" data-num="1">1<span class="num-count"></span></button>
      <button class="num-btn" data-num="2">2<span class="num-count"></span></button>
      <button class="num-btn" data-num="3">3<span class="num-count"></span></button>
      <button class="num-btn" data-num="4">4<span class="num-count"></span></button>
      <button class="num-btn" data-num="5">5<span class="num-count"></span></button>
      <button class="num-btn" data-num="6">6<span class="num-count"></span></button>
      <button class="num-btn" data-num="7">7<span class="num-count"></span></button>
      <button class="num-btn" data-num="8">8<span class="num-count"></span></button>
      <button class="num-btn" data-num="9">9<span class="num-count"></span></button>
    </div>

<script>
      try {
        const s = JSON.parse(localStorage.getItem('gameState') || '{}');
        if (s.board && s.solution) {
          const counts = new Array(10).fill(0);
          for (let r = 0; r < 9; r++)
            for (let c = 0; c < 9; c++)
              if (s.board[r][c] && s.board[r][c] === s.solution[r][c])
                counts[s.board[r][c]]++;
          document.querySelectorAll('.num-btn').forEach(btn => {
            const n = +btn.dataset.num;
            const remaining = 9 - counts[n];
            btn.querySelector('.num-count').textContent = remaining;
            if (remaining === 0) btn.classList.add('complete');
          });
        }
      } catch {}
    </script>
    </div>

    <!-- Settings modal -->
    <div class="modal-overlay" id="settingsModal" hidden>
      <div class="modal settings-modal">
        <button class="modal-close" id="settingsClose" aria-label="Close">✕</button>
        <h2 class="modal-title">Settings</h2>

        <div class="settings-tabs" id="settingsTabs">
          <button class="settings-tab active" data-panel="panel-general" type="button">General</button>
          <button class="settings-tab" data-panel="panel-gameplay" type="button">Game</button>
          <button class="settings-tab" data-panel="panel-feedback" type="button">Effects</button>
        </div>

        <div class="settings-body">

          <div class="settings-panel" id="panel-general">
            <div class="setting-group">
              <div class="setting-row">
                <span class="setting-label">Dark mode</span>
                <label class="toggle">
                  <input type="checkbox" id="darkToggle">
                  <span class="toggle-thumb"></span>
                </label>
              </div>
              <div class="setting-row">
                <span class="setting-label">Language</span>
                <select class="setting-select" id="languageSelect">
                  <option value="en">🇬🇧 English</option>
                </select>
              </div>
            </div>
          </div>

          <div class="settings-panel" id="panel-gameplay" hidden>
            <div class="setting-group">
            <div class="setting-row">
              <span class="setting-label">Hints</span>
              <label class="toggle">
                <input type="checkbox" id="hintsToggle">
                <span class="toggle-thumb"></span>
              </label>
            </div>

            <div class="setting-row">
              <span class="setting-label">Mistakes</span>
              <label class="toggle">
                <input type="checkbox" id="mistakesToggle">
                <span class="toggle-thumb"></span>
              </label>
            </div>

            <div class="setting-row">
              <span class="setting-label">Timer</span>
              <label class="toggle">
                <input type="checkbox" id="timerToggle">
                <span class="toggle-thumb"></span>
              </label>
            </div>

            <div class="setting-row">
              <span class="setting-label">Smart notes</span>
              <label class="toggle">
                <input type="checkbox" id="smartNotesToggle">
                <span class="toggle-thumb"></span>
              </label>
            </div>
            </div>
          </div>

          <div class="settings-panel" id="panel-feedback" hidden>
            <div class="setting-group">
              <div class="setting-row">
                <span class="setting-label">Sound</span>
                <label class="toggle">
                  <input type="checkbox" id="soundToggle">
                  <span class="toggle-thumb"></span>
                </label>
              </div>

              <div class="setting-row">
                <span class="setting-label">Vibration</span>
                <label class="toggle">
                  <input type="checkbox" id="vibrationToggle">
                  <span class="toggle-thumb"></span>
                </label>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- New Game modal -->
    <div class="modal-overlay" id="newGameModal" hidden>
      <div class="modal">
        <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
        <h2 class="modal-title" style="margin-bottom:4px">New Puzzle</h2>
        <p class="modal-subtitle">Choose a difficulty</p>
        <div class="slider-block" id="diffSliderBlock">
          <div class="diff-pill-row"><div class="diff-pill" id="diffPill">Easy</div></div>
          <div class="diff-track-wrap" id="diffTrackWrap">
            <div class="diff-base-track"></div>
            <div class="diff-fill-bar" id="diffFillBar"></div>
            <div class="diff-dots-overlay" id="diffDotsOverlay">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
            <input type="range" min="0" max="4" step="1" value="1" id="diffSlider" aria-label="Difficulty">
          </div>
          <div class="diff-numbers" id="diffNumbers">
            <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
          </div>
        </div>
        <button class="primary-btn" id="diffStart">Start</button>
      </div>
    </div>

    <!-- Game over overlay -->
    <div class="win-overlay" id="gameOverOverlay" hidden>
      <div class="win-card">
        <div class="win-emoji">💀</div>
        <h2>Game Over</h2>
        <p class="win-time">Too many mistakes.</p>
        <button class="primary-btn" id="gameOverNewGame">Ok</button>
      </div>
    </div>

    <!-- Win overlay -->
    <div class="win-overlay" id="winOverlay" hidden>
      <div class="win-card">
        <div class="win-emoji">🎉</div>
        <h2>Puzzle Solved!</h2>
        <p class="win-time" id="winTime"></p>
        <button class="primary-btn" id="winNewGame">Ok</button>
      </div>
    </div>

  </div>
  <script src="puzzles/level1.js"></script>
  <script src="puzzles/level2.js"></script>
  <script src="puzzles/level3.js"></script>
  <script src="puzzles/level4.js"></script>
  <script src="puzzles/level5.js"></script>
  <script src="app.js?v=38"></script>
</body>
</html>
