<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#111827" id="themeColor">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sudoku">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css?v=7">
  <title>Sudoku</title>
  <script>if (localStorage.getItem('theme') !== 'light') document.documentElement.classList.add('dark');</script>
</head>
<body>
  <div class="app">

    <header class="header">
      <button class="header-btn icon-btn" id="newGameBtn" aria-label="New Game">🔄</button>
      <h1 class="title">Sudoku</h1>
      <button class="header-btn icon-btn" id="gearBtn" aria-label="Settings">⚙️</button>

      <div class="settings-popover" id="settingsPopover" hidden>
        <div class="setting-row">
          <span class="setting-label">Dark mode</span>
          <label class="toggle">
            <input type="checkbox" id="darkToggle">
            <span class="toggle-thumb"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="setting-label">Show hints</span>
          <label class="toggle">
            <input type="checkbox" id="hintsToggle">
            <span class="toggle-thumb"></span>
          </label>
        </div>
        <div class="setting-row">
          <span class="setting-label">Count mistakes</span>
          <label class="toggle">
            <input type="checkbox" id="mistakesToggle">
            <span class="toggle-thumb"></span>
          </label>
        </div>
      </div>
    </header>

    <div class="stats-bar">
      <div class="current-diff" id="currentDiff">Easy</div>
      <div class="timer" id="timer">0:00</div>
      <div class="mistakes" id="mistakes">Mistakes: 0/3</div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="undoBtn">
        <span class="ctrl-icon">↩️</span>
        <span class="ctrl-label">Undo</span>
      </button>
      <button class="ctrl-btn" id="eraseBtn">
        <span class="ctrl-icon">✖️</span>
        <span class="ctrl-label">Erase</span>
      </button>
      <button class="ctrl-btn" id="notesBtn">
        <span class="ctrl-icon">✏️</span>
        <span class="ctrl-label">Notes</span>
      </button>
      <button class="ctrl-btn" id="hintBtn">
        <span class="ctrl-icon">💡</span>
        <span class="ctrl-label">Hint</span>
      </button>
    </div>

    <div class="numpad" id="numpad">
      <button class="num-btn" data-num="1">1<span class="num-count"></span></button>
      <button class="num-btn" data-num="2">2<span class="num-count"></span></button>
      <button class="num-btn" data-num="3">3<span class="num-count"></span></button>
      <button class="num-btn" data-num="4">4<span class="num-count"></span></button>
      <button class="num-btn" data-num="5">5<span class="num-count"></span></button>
      <button class="num-btn" data-num="6">6<span class="num-count"></span></button>
      <button class="num-btn" data-num="7">7<span class="num-count"></span></button>
      <button class="num-btn" data-num="8">8<span class="num-count"></span></button>
      <button class="num-btn" data-num="9">9<span class="num-count"></span></button>
    </div>

    <!-- New Game modal -->
    <div class="modal-overlay" id="newGameModal" hidden>
      <div class="modal">
        <h2 class="modal-title">New Game</h2>
        <p class="modal-warning" id="modalWarning" hidden>Your current game will be lost</p>
        <div class="diff-cards">
          <button class="diff-card" data-difficulty="easy">Easy</button>
          <button class="diff-card" data-difficulty="medium">Medium</button>
          <button class="diff-card" data-difficulty="hard">Hard</button>
        </div>
        <button class="modal-cancel" id="modalCancel">Cancel</button>
      </div>
    </div>

    <!-- Win overlay -->
    <div class="win-overlay" id="winOverlay" hidden>
      <div class="win-card">
        <div class="win-emoji">🎉</div>
        <h2>Puzzle Solved!</h2>
        <p class="win-time" id="winTime"></p>
        <button class="primary-btn" id="winNewGame">Play Again</button>
      </div>
    </div>

  </div>
  <script src="app.js?v=4"></script>
</body>
</html>
